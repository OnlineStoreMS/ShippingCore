<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>OSMS 快递助手打单助手</title>
    <style>
      body {
        margin: 0;
        min-width: 320px;
        font: 13px/1.45 system-ui, sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      main { padding: 12px 14px 16px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      .ok { color: #15803d; }
      .warn { color: #b45309; }
      .bad { color: #b91c1c; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
      input, button {
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        padding: 6px 10px;
        font: inherit;
      }
      input { flex: 1; min-width: 0; }
      button {
        border: 0;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        white-space: nowrap;
      }
      button.secondary { background: #64748b; }
      button.danger { background: #dc2626; }
      pre {
        background: #e2e8f0;
        border-radius: 8px;
        padding: 8px;
        white-space: pre-wrap;
        font-size: 11px;
        max-height: 140px;
        overflow: auto;
        margin: 8px 0 0;
      }
      .hint { color: #64748b; font-size: 12px; margin-top: 8px; }
      .block { margin-top: 12px; padding-top: 10px; border-top: 1px solid #e2e8f0; }
      label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
      .pair-code {
        font-size: 36px;
        font-weight: 700;
        letter-spacing: 0.25em;
        text-align: center;
        color: #1d4ed8;
        padding: 12px 0 4px;
      }
      .pair-expire {
        text-align: center;
        color: #64748b;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>OSMS 快递助手打单助手</h1>
      <div id="status" class="warn">读取中…</div>
      <div id="device" class="hint"></div>

      <div id="pairBlock" class="block" hidden>
        <button type="button" id="createPairBtn">生成配对码</button>
        <div id="pairShow" hidden>
          <div class="pair-code" id="pairCodeShow">------</div>
          <div class="pair-expire" id="pairExpireShow"></div>
        </div>
        <div class="hint">在手机 OpsMobile「快递助手插件」页输入上方配对码完成绑定。</div>
      </div>

      <div id="boundBlock" class="block" hidden>
        <div class="row">
          <button type="button" id="claimBtn">立即领任务</button>
          <button type="button" class="secondary" id="refreshBtn">刷新状态</button>
          <button type="button" class="danger" id="unpairBtn">解绑</button>
        </div>
        <div class="hint">请保持本机快递助手已登录，并长期打开浏览器窗口。</div>
      </div>

      <div class="block">
        <label>当前任务</label>
        <pre id="task">无任务</pre>
        <button type="button" class="secondary" id="clear">清除当前任务</button>
      </div>

      <div class="block">
        <label>API 地址（一般无需改）</label>
        <div class="row">
          <input id="apiBase" placeholder="https://osms.zfcycle.com/apps/shipping/api/v1" />
          <button type="button" class="secondary" id="saveApi">保存</button>
        </div>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
